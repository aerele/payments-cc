
{% extends "templates/web.html" %}

{% block title %} Payment {% endblock %}

{%- block header -%}{% endblock %}

{% block script %}
<script>{% include "templates/includes/make_payment.js" %}</script>
{% endblock %}

{%- block page_content -%}
<p class='lead text-center' style="padding-top: 20px;">
	<div class="payment-form"></div>
    <h2 class="payment-title">Make Payment</h2>
    <form id="paymentForm">
        <div class="form-group">
            <label for="orderId">Order ID</label>
            <input type="text" id="orderId" name="orderId" placeholder="Enter order ID" required>
        </div>
        <div class="form-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" name="amount" step="0.001" placeholder="Enter amount" required>
        </div>
        <div class="card-header">
            <h3 class="payment-title">Available Payment Options</h3>
        </div>
        <div id="button-group" class="button-group">
        </div>
    </form>
</p>
<style>
    {% include "templates/styles/make_payment.css" %}
</style>
{% endblock %}
